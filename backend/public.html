<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiDear 公开信息演示</title>
<style>body{font:18px/1.7 system-ui,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;color:#18343c;background:#f5faf9}h1{line-height:1.3}label{display:block}input,button{font:inherit;padding:12px;border:1px solid #66847f;border-radius:8px}input{width:90%;margin:8px 0}button{background:#16665b;color:white;cursor:pointer;margin:8px 6px 8px 0}article{background:white;padding:22px;border-radius:12px;margin:20px 0}a{color:#075eaa}#status{min-height:2em}pre{white-space:pre-wrap;font:inherit}</style>
<h1>HiDear · 重要信息与行动</h1><p>面向聋人的文字信息助手 · 免费公开查询演示</p>
<p>这里只查询已收录的公开信息，提供来源与行动准备建议。收录范围有限，空结果不代表没有相关政策；个人资格需要通过官方办事指南核对。</p>
<form id="search"><label for="query">想了解什么？</label><input id="query" placeholder="例如：补贴、办证、残疾人服务"><label for="city">城市（可留空）</label><input id="city" placeholder="例如：北京"><button>查询信息</button></form>
<p id="status" role="status" aria-live="polite"></p><section id="results" aria-label="查询结果"></section>
<p>核验记录只说明收录时检查过的内容。请打开官方原文确认最新要求。本演示不接收个人资料、不提交报名、不创建待办或手机提醒。</p>
<script>
const status=document.querySelector('#status'), results=document.querySelector('#results');
function text(tag,value,parent){const node=document.createElement(tag);node.textContent=value;parent.append(node);return node;}
async function call(name,args){const response=await fetch('/public/tools/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error?.message||'暂时无法查询');return data.result;}
document.querySelector('#search').addEventListener('submit',async event=>{event.preventDefault();status.textContent='正在查询…';results.replaceChildren();const args={};for(const key of ['query','city']){const value=document.querySelector('#'+key).value.trim();if(value)args[key]=value;}try{const data=await call('search_information',args);const items=data.items||[];status.textContent=items.length?'找到 '+items.length+' 条收录信息':'暂无匹配的收录信息。可调整关键词，并继续查看当地官方渠道。';for(const item of items){const article=document.createElement('article');results.append(article);text('h2',item.title,article);text('p',item.summary,article);text('p','核验状态：'+({partially_verified:'部分核验',verified:'已核验',unverified:'待核验'}[item.verification_status]||item.verification_status),article);const link=text('a','查看官方原文',article);const source=new URL(item.source_url);if(source.protocol==='https:'){link.href=source.href;link.target='_blank';link.rel='noopener noreferrer';}const button=text('button','查看详情与行动清单',article);const detail=document.createElement('div');article.append(detail);button.addEventListener('click',async()=>{button.disabled=true;detail.replaceChildren();try{const info=await call('get_information',{information_id:item.id});const plan=await call('prepare_action',{information_id:item.id});text('h3','核验详情',detail);text('p',info.verification_evidence||'暂无核验证据',detail);text('p','核验记录时间：'+(info.checked_at||'未知'),detail);text('h3','行动准备',detail);for(const [label,values] of [['办理条件',plan.conditions],['所需材料',plan.materials],['还需核对',plan.unknown_fields],['下一步',plan.steps]]){text('h4',label,detail);const list=document.createElement('ul');detail.append(list);for(const value of values.length?values:['尚未确认，请查看具体事项办事指南'])text('li',value,list);}text('p','尚未判断个人资格，尚未提交申请。',detail);}catch(error){text('p',error.message,detail);}finally{button.disabled=false;}});}}catch(error){status.textContent='查询暂不可用：'+error.message+'。免费服务若刚唤醒，请稍后重试。';}});
</script></html>
